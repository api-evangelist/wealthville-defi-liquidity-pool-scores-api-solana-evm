  cursor: false
  note: >-
    No cursor, offset or page token is published. Collections are bounded by limit alone, so there is
    no documented way to walk past the head of a list.
filtering:
  - {name: chain, in: query, applies_to: [GET /api/v1/scores/top], values: "solana | evm | ethereum | base | arbitrum | optimism | polygon | bsc"}
caching:
