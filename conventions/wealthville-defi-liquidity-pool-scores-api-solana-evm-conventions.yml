idempotency:
  supported: true
  mechanism: safe-methods-only
  note: >-
    Every operation in the published contract is a GET, and the provider's own MCP tool annotations
    set idempotentHint true and readOnlyHint true on all four tools. Repeating any call is safe and
    side-effect-free by construction. There is no write surface and therefore no Idempotency-Key
    header - the guarantee comes from the API being wholly read-only, which is the strongest form of
    it for an agent caller.
  evidence:
    - openapi declares only GET operations (5 of 5)
    - mcp tools/list annotations idempotentHint=true, readOnlyHint=true, destructiveHint=false (4 of 4)
pagination:
