tools:
- name: get_pool_score
  description: Get the Wealthville verdict (ENTER/HOLD/EXIT/AVOID) and scores (enter/hold/exit + composite
    Wealthville Score, 0-100) for one liquidity pool. Use before recommending or opening any LP position.
    Accepts a Solana pool address (base58) or an EVM 0x address / DefiLlama pool UUID.
  title: Look up a pool score and verdict
  input:
    pool_address:
      type: string
      required: true
      minLength: 8
  read_only: true
  idempotent: true
  source_operation: openapi/wealthville-defi-liquidity-pool-scores-api-solana-evm-public-data-openapi.json#GET
    /api/v1/scores/{poolAddress}
- name: get_top_pools
  description: List liquidity pools ranked by composite Wealthville Score (0-100), freshly scored within
    the last 6 hours. Good for "what are the best pools right now?" questions.
  title: List top-ranked liquidity pools
  input:
    limit:
      type: integer
      required: false
      minimum: 1
      maximum: 100
    chain:
      type: string
      required: false
  read_only: true
  idempotent: true
  source_operation: openapi/wealthville-defi-liquidity-pool-scores-api-solana-evm-public-data-openapi.json#GET
    /api/v1/scores/top
- name: get_track_record
  description: 'Get Wealthville''s live signal track record: per-action hit rates, IL-adjusted 7-day PnL,
    and recent resolved signals — misses included (the ledger is immutable at publish time). Use when
    asked whether Wealthville scores can be trusted, or for the system''s recent performance.'
  title: Get the published signal track record
  input:
    days:
      type: integer
      required: false
      minimum: 7
      maximum: 90
  read_only: true
  idempotent: true
  source_operation: openapi/wealthville-defi-liquidity-pool-scores-api-solana-evm-public-data-openapi.json#GET
    /api/v1/track-record
- name: get_signals_feed
  description: Get the latest published Wealthville signals (ENTER/EXIT/RISK_OFF calls with narrative
    and confidence). Use for "any new LP signals?" questions.
  title: Get the latest published signals
  input:
    limit:
      type: integer
      required: false
      minimum: 1
      maximum: 50
  read_only: true
  idempotent: true
  source_operation: openapi/wealthville-defi-liquidity-pool-scores-api-solana-evm-public-data-openapi.json#GET
    /api/v1/signals/feed
