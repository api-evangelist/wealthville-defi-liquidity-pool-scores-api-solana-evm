name: WealthVille — DeFi Liquidity Pool Scores API (Solana & EVM)
description: >-
  WealthVille provides a public, keyless REST API and agent-native surfaces for DeFi liquidity-pool scoring and signals
  across Solana and EVM chains. It exposes a composite Wealthville Score (0-100) with Enter/Hold/Exit verdicts,
  per-protocol confidence, Solana sub-scores (Risk, Scout, Farmer), an outcome-labeled track record, and a signals feed.
  Coverage includes Solana (Meteora, Orca, Raydium) and EVM chains (Ethereum, Arbitrum, Base, Optimism, Polygon, BNB
  Chain). The API is anonymous by default at 60 requests/min per IP, CORS-open, and read-only — every published
  operation is a GET. Alongside the REST contract WealthVille publishes an OpenAPI 3.0.3 document at the API host root,
  an llms.txt, a hosted Streamable-HTTP MCP server with four ungated tools, and a first-party MIT-licensed connector
  family (MCP server, ElizaOS plugin, Solana Agent Kit plugin, MCPB bundle, Gemini extension) plus its own Agent Skill.
